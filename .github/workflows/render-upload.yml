name: Render long ambient video + upload to YouTube

# Manual trigger only (Actions tab or `python3 make_long.py --hours 8 ...`).
# Heavy work happens on the runner: your laptop sends API calls only.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Target video length in hours"
        required: true
        default: "1"
        type: choice
        options: ["1", "8"]
      title:
        description: "YouTube title"
        required: true
        default: "Rain on Glass Window | Cozy Ambient Sleep Sounds"
      description:
        description: "YouTube description"
        required: false
        default: "Soft rain falling on a glass window. Loopable ambient rain for sleep, study and relaxation."
      privacy:
        description: "Visibility (private = draft, only you see it)"
        required: true
        default: "private"
        type: choice
        options: ["private", "unlisted"]
      footage:
        description: "Scenery (window = cozy, woods/leaves = greenery)"
        required: true
        default: "woods"
        type: choice
        options: ["window", "woods", "leaves"]
      quality:
        description: "Output quality (1080p recommended; 720p is faster/smaller)"
        required: true
        default: "1080p"
        type: choice
        options: ["1080p", "720p"]
      audio_seed:
        description: "Rain mix seed (change for a different performance)"
        required: false
        default: "7"
      master_minutes:
        description: "Seamless master length in minutes (looped to reach hours)"
        required: false
        default: "10"

concurrency:
  group: render-upload
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download source assets
        run: bash scripts/download_assets.sh

      - name: Render seamless master (audio + video)
        run: |
          MASTER_SEC=$(( ${{ inputs.master_minutes }} * 60 ))
          case "${{ inputs.footage }}" in
            window) SRC=sources/rain_window_home.mp4; LSEC=55 ;;
            woods)  SRC=sources/rain_woods.mp4;         LSEC=18 ;;
            leaves) SRC=sources/rain_leaves.mp4;        LSEC=10 ;;
          esac
          case "${{ inputs.quality }}" in
            1080p) HEIGHT=1080 ;;
            720p)  HEIGHT=720 ;;
          esac
          echo "HEIGHT=$HEIGHT" >> "$GITHUB_ENV"
          python3 rain_sample_mix.py --duration "$MASTER_SEC" --out master_audio.wav --seed "${{ inputs.audio_seed }}"
          python3 scripts/make_intro.py --out intro.mp4 --icon avatars/v1_moon_rain.png \
            --height "$HEIGHT" --name "Ambientful Ambient Sounds"
          python3 video_loop.py --src "$SRC" --height "$HEIGHT" --preset veryfast --crf 21 --abr 256k \
            --audio master_audio.wav --out master.mp4 --loop-sec "$LSEC" --total "$MASTER_SEC" \
            --intro intro.mp4

      - name: Burn transparent subscribe overlay onto master
        run: |
          python3 scripts/make_overlay.py --outdir overlay_frames \
            --icon avatars/v1_moon_rain.png --height "$HEIGHT"
          python3 scripts/apply_overlay.py --video master.mp4 \
            --frames overlay_frames --out master_ov.mp4
          mv master_ov.mp4 master.mp4

      - name: Extend master to target hours (seamless copy-loop)
        run: |
          TARGET_SEC=$(( ${{ inputs.hours }} * 3600 ))
          echo "TARGET_SEC=$TARGET_SEC" >> "$GITHUB_ENV"
          python3 scripts/extend_loop.py --src master.mp4 --out long.mp4 --seconds "$TARGET_SEC"
          ls -lh long.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 long.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
        run: |
          python3 scripts/upload_youtube.py --file long.mp4 \
            --title "${{ inputs.title }}" \
            --description "${{ inputs.description }}" \
            --privacy "${{ inputs.privacy }}" | tee upload.log
          grep -o 'https://www.youtube.com/watch?v=[A-Za-z0-9_-]*' upload.log | head -n 1 >> "$GITHUB_STEP_SUMMARY" || true
