name: Render rain (10 min + 8 h) and upload

# Everything heavy happens on the runner. The job builds both lengths from the
# same master, returns the 10-minute cut as an artifact for review, and uploads
# the 8-hour cut to YouTube as a private draft (or scheduled with publish_at).
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the 8-hour cut to YouTube"
        required: true
        default: "yes"
        type: choice
        options: ["yes", "no"]
      privacy:
        description: "YouTube visibility"
        required: true
        default: "private"
        type: choice
        options: ["private", "unlisted", "public"]
      publish_at:
        description: "Optional schedule (ISO 8601 UTC, e.g. 2026-10-30T19:00:00Z)"
        required: false
        default: ""

concurrency:
  group: render-rain
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Python deps
        timeout-minutes: 5
        run: |
          python3 -m pip install --quiet --break-system-packages numpy
          ffmpeg -version | head -n 1

      - name: Fetch footage (Pexels licence)
        timeout-minutes: 10
        run: |
          mkdir -p footage/pexels
          curl -L --fail --retry 3 -o footage/pexels/pexels_30770305_1080.mp4 \
            "https://videos.pexels.com/video-files/30770305/13162097_1920_1080_30fps.mp4"
          curl -L --fail --retry 3 -o footage/pexels/pexels_36344044_rain_overlay.mp4 \
            "https://videos.pexels.com/video-files/36344044/15415146_1920_1080_60fps.mp4"
          ls -lh footage/pexels

      - name: Build 10-minute and 8-hour cuts
        timeout-minutes: 300
        env:
          MINUTES: "600"
          LONG_SECONDS: "28800"
        run: |
          set -x
          chmod +x scripts/*.sh
          ./scripts/make_layered_demo.sh
          ls -lh ambient_demo_600s_rain.mp4 ambient_demo_28800s_rain.mp4

      - name: Refresh GitHub Pages preview
        run: |
          set -e
          mkdir -p docs/assets
          cp -f assets/thumbnail.jpg assets/title.png docs/assets/
          ffmpeg -y -nostdin -v error -ss 0 -t 15 -i ambient_master_rain_60s.mp4 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 96k -ar 44100 -movflags +faststart docs/preview.mp4
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/preview.mp4 docs/assets/thumbnail.jpg docs/assets/title.png
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "chore: refresh site preview clip and assets [skip ci]"
            git push
          fi

      - name: Publish 10-min cut as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="preview"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Preview assets" \
            --notes "Auto-published preview assets for the ambient-rain GitHub Pages site." \
            --latest=false
          gh release upload "$TAG" ambient_demo_600s_rain.mp4 --clobber

      - name: Upload 10-minute cut (review copy)
        uses: actions/upload-artifact@v4
        with:
          name: rain-demo-600s
          path: ambient_demo_600s_rain.mp4
          retention-days: 7
          compression-level: 0

      - name: Upload 8-hour cut to YouTube
        if: ${{ inputs.upload == 'yes' }}
        timeout-minutes: 120
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          ARGS=(--file ambient_demo_28800s_rain.mp4
                --meta upload/metadata.json
                --thumbnail assets/thumbnail.jpg
                --privacy "${{ inputs.privacy }}")
          if [ -n "$PUBLISH_AT" ]; then ARGS+=(--publish-at "$PUBLISH_AT"); fi
          python3 scripts/upload_youtube.py "${ARGS[@]}"
